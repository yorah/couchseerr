name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Off so a failure on one interpreter does not cancel the other. The two disagree
      # often enough to be worth running as a matrix at all, and cancelling the second
      # throws away exactly the comparison that makes the first one readable.
      fail-fast: false
      matrix:
        # 3.8 is the source-level floor; 3.13 is what the target device actually runs.
        python-version: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install pytest
      - name: Byte-compile
        run: python -m compileall -q plugin.video.couchseerr
      - name: Tests
        run: python -m pytest -q
      - name: Core stays free of Kodi imports
        run: python scripts/check_no_kodi_imports.py
      - name: No secrets or private data in the tree
        run: python scripts/check_no_secrets.py
      - name: Fixtures match their generator
        run: |
          python tests/fixtures/generate.py > /dev/null
          git diff --exit-code tests/fixtures/seerr
      - name: Repository datadir builds and validates
        run: |
          python scripts/build_repo.py dist
          python scripts/check_repo.py dist

  addon-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One runner per branch, deliberately. Each invocation downloads addons.xml.gz for
      # all ten Kodi branches from mirrors.kodi.tv, which redirects every request to a
      # different volunteer mirror, so chaining two invocations on one runner would put
      # twenty of those fetches behind a single egress IP and let one slow mirror fail
      # both checks at once. fail-fast is off so a mirror that takes down one branch
      # cannot cancel the other, which is the whole point of splitting them.
      fail-fast: false
      matrix:
        # The oldest and newest branches we claim to support, since the rule sets differ
        # and passing one does not imply passing the other.
        kodi-branch: [matrix, omega]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned below the runner default on purpose: kodi-addon-checker 0.0.36 dies
          # with a SyntaxError on 3.13 (xbmc/addon-check#280, open and unattended).
          python-version: "3.11"
      - run: pip install kodi-addon-checker
      # Through the wrapper, which fails on everything the checker reports and exits 0
      # only when it could not reach the mirrors at all. See scripts/run_addon_checker.py.
      - run: python scripts/run_addon_checker.py --branch=${{ matrix.kodi-branch }} plugin.video.couchseerr

  version-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Addon changes require a version bump
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --quiet "$base" HEAD -- plugin.video.couchseerr; then
            echo "addon untouched, no bump required"; exit 0
          fi
          # Extracted via the ElementTree-based helper in build_repo.py, not grep: the
          # addon.xml XML declaration also contains version="1.0", which a naive
          # `grep -oP 'version="\K[0-9.]+'` matches before it ever reaches the real
          # <addon version="..."> attribute, so it always compares "1.0" to "1.0".
          git show "$base:plugin.video.couchseerr/addon.xml" > /tmp/old_addon.xml
          old=$(python scripts/build_repo.py version /tmp/old_addon.xml)
          new=$(python scripts/build_repo.py version plugin.video.couchseerr)
          echo "addon.xml version: $old -> $new"
          if [ "$old" = "$new" ]; then
            echo "FAIL: addon changed without a version bump"; exit 1
          fi
